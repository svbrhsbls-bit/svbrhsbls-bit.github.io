<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Result System - Login</title>

    <meta
        http-equiv="refresh"
        content="0;url=https://svbrhsbls-bit.github.io/school-result/login.html"
    >

    <script>
        window.location.replace(
            "https://svbrhsbls-bit.github.io/school-result/login.html"
        );
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            text-align: center;
        }

        .box {
            padding: 30px;
        }

        .loader {
            width: 45px;
            height: 45px;
            margin: 0 auto 20px;
            border: 4px solid #ddd;
            border-top: 4px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="loader"></div>

        <h2>School Result System</h2>

        <p>Opening Login...</p>

        <p>
            If Login does not open automatically,
            <a href="https://svbrhsbls-bit.github.io/school-result/login.html">
                Click here
            </a>
        </p>

    </div>

</body>
</html>
